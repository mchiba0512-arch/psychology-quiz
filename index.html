und .12s}.choice:hover{border-color:#7099f6}.choice.selected{border-color:#82acff;background:#233d65}.marker{flex-shrink:0;min-width:26px;font-weight:800;color:#a9c6ff}.matchbox{display:grid;gap:14px}.matchrow{border:1px solid #38455e;border-radius:13px;padding:13px;background:#1c263a;line-height:1.65}.matchrow label{display:block;margin:0 0 10px}.matchrow select{width:100%;border-radius:10px;color:var(--ink);border:1px solid #637391;background:#15203a;padding:10px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}.feedback{padding:17px;margin-top:18px;border-radius:14px;line-height:1.8;border:1px solid #596787;background:#1f2c41}.feedback.good{border-color:#318b72;background:#15382f}.feedback.bad{border-color:#a95865;background:#41242b}.answer{margin-top:12px;padding:14px;border:1px solid #42516e;border-radius:12px;background:#0f1828}.answer b{color:#a9c5ff}.answer pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font:inherit;margin:8px 0 0}.warning{color:#ffd4a0;background:#42301d;border:1px solid #80613b;padding:14px;border-radius:12px;line-height:1.7}.tiny{font-size:12px;color:var(--muted)}.summary{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;margin:15px 0}.stat{border:1px solid var(--border);background:#1c2840;border-radius:12px;padding:13px;flex:1;min-width:130px}.footerline{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.8}@media(max-width:580px){.app{padding:8px 12px 50px}header{padding:29px 14px 12px}.card{border-radius:18px}.tab{padding:9px 10px}.actions .btn{flex:1}.toolbar{gap:7px}}
.source-image{display:block;max-width:100%;height:auto;border-radius:8px;background:white;margin:12px auto;image-rendering:auto}.image-note{color:var(--muted);font-size:13px;line-height:1.7}.image-options{display:grid;gap:10px;margin-top:16px}.image-row{border:1px solid var(--border);padding:12px;border-radius:12px;background:#1c263a}.image-row label{display:block;margin-bottom:8px;font-weight:650}.image-row select{width:100%;min-height:44px;background:#15203a;color:var(--ink);border:1px solid #637391;border-radius:9px;padding:9px;font:inherit}.source-image-holder{overflow-x:auto}</style></head><body><header><div class="eyebrow">STUDY MODE / SELF QUIZ</div><h1>暮らしと心理学 <span style="color:#91b6ff">小テスト対策</span></h1><p>配布Excelに記載された問題文・選択肢・正解をそのまま収録。選択して答え合わせし、苦手な問題を繰り返し練習できます。</p></header><main class="app"><div class="toolbar" id="tabs"></div><div class="toolbar"><button class="btn" id="shuffle">🔀 出題順をシャッフル</button><button class="btn" id="wrong">間違えた問題だけ</button><button class="btn" id="all">すべての問題</button><button class="btn" id="reset">学習記録をリセット</button></div><div class="statusbar"><div style="flex:1;min-width:200px"><strong id="count"></strong><div class="progress"><div id="fill"></div></div></div><span id="score" class="muted"></span></div><div id="content"></div><p class="footerline">※画像で示された選択肢と正解は、元Excelの画像をそのまま掲載しています。正解判定は配布資料の解答に基づきます。学習履歴はこのブラウザー内にのみ保存されます。</p></main><script>
const DATA=[{"sheet": "第1回～第3回", "row": 3, "number": "問1", "question": "WHOの健康の定義に関して、下の選択肢の中から関連する適切な記述を3つ選びなさい（「第1回心の健康とは」より）。", "options": "  1. 心と身体を分けて健康を考えてはいけない\n  2. 健康とは、身体的にも、精神的にも、社会的にも完全に良好な状態を意味する\n  3. 精神的に良好であるためには、社会的に良好な状態であることが重要である\n  4. 心と身体は性質の異なるものであるから、それぞれ別個に健康を考える必要がある\n  5. 健康とは、身体的に疾病でない状態を意味する", "answer": "3. 精神的に良好であるためには、社会的に良好な状態であることが重要である\n2. 健康とは、身体的にも、精神的にも、社会的にも完全に良好な状態を意味する\n1. 心と身体を分けて健康を考えてはいけない"}, {"sheet": "第1回～第3回", "row": 4, "number": "問2", "question": "ジョハリの窓に関して、以下の記述は4つの領域「開放」「盲点」「隠蔽（いんぺい）」「未知」のどれに対応するか。選択肢（プルダウン）の中から選びなさい（「第1回心の健康とは」より）。", "options": "A群\n  1 自分も相手もまだ気づいていない、自分の伸びしろや成長の余地\n  2 真の姿で取り組める\n  3 自分の適性や長所短所など、相手は分かっているが、自分は気づいていない\n  4 自分の劣等感など、自分は認識していることを、相手に気づかれないように振る舞う\n  5 相互理解の上で活動できる\nB群\n  01 未知\n  02 隠蔽\n  03 開放\n  04 盲点", "answer": "1 - 01. 未知\n2 - 03. 開放\n3 - 04. 盲点\n4 - 02. 隠蔽\n5 - 03. 開放"}, {"sheet": "第1回～第3回", "row": 5, "number": "問3", "question": "ジョハリの窓において、「開放」領域を広げていくことと関連する適切な記述を、下の選択肢の中から4つ選びなさい（「第1回心の健康とは」より）。", "options": "  1. 自分が理解していないことを、周囲の人に気づかせてもらう\n  2. まだ見知らぬ自分との出会いのチャンス\n  3. 自己顕示\n  4. 自己開示\n  5. 信頼できる相手に素直に相談してみる\n  6. 嘘も方便", "answer": "4. 自己開示\n1. 自分が理解していないことを、周囲の人に気づかせてもらう\n2. まだ見知らぬ自分との出会いのチャンス\n5. 信頼できる相手に素直に相談してみる"}, {"sheet": "第1回～第3回", "row": 6, "number": "問4", "question": "パーソナリティの定義に関して、下の選択肢の中から適切な記述を3つ選びなさい（「第2回パーソナリティ：類型論」より）。\n", "options": "  1. 個性的な生き方\n  2. ラジオ番組やイベントなどで司会進行役を担うこと\n  3. その人らしさ\n  4. 見かけ上の社会的な顔\n  5. 個人の中にあって、その人に特徴的な行動や考えを決定するところの、精神身体的体系の動的体制\n  6. 各々の人間に特有の行動の仕方", "answer": "6. 各々の人間に特有の行動の仕方\n3. その人らしさ\n5. 個人の中にあって、その人に特徴的な行動や考えを決定するところの、精神身体的体系の動的体制"}, {"sheet": "第1回～第3回", "row": 7, "number": "問5", "question": "オールポートによるパーソナリティの定義「個人の中にあって、その人に特徴的な行動や考えを決定するところの、精神身体的体系の動的体制」に関する説明として、下の選択肢の中から関連する適切な記述を3つ選びなさい（「第2回パーソナリティ：類型論」より）。", "options": "  1. 健康を規定する要因\n  2. 創造性\n  3. 心と身体の動きのある（dynamic）仕組み\n  4. 心と身体の安定的な（stable）結びつき\n  5. 行動を規定する要因\n  6. 独自性", "answer": "3. 心と身体の動きのある（dynamic）仕組み\n6. 独自性\n5. 行動を規定する要因"}, {"sheet": "第1回～第3回", "row": 8, "number": "問6", "question": "キャッテルが提唱した関数式　R=ｆ(S・P)　は何を意味するか。下の選択肢の中から適切な記述を3つ選びなさい（「第2回パーソナリティ：類型論」より）。", "options": " 1. 個人のパーソナリティは、様々な状況下での行動的反応を繰り返すことによって形成される\n  2. 状況は同じでも、人によって行動的反応が異なるのは、パーソナリティが仲介しているため\n  3. 対人関係は、様々な状況下で人がどのように振る舞うかで規定される\n  4. 一定の場面に置かれた個人が，どういう行動をとるかを示すもの\n  5. Rは個人の行動的反応、Sは個人が置かれた状況、Pはパーソナリティを意味する\n  6. Rは対人関係、Sは状況性、Pは人を意味する", "answer": "5. Rは個人の行動的反応、Sは個人が置かれた状況、Pはパーソナリティを意味する\n2. 状況は同じでも、人によって行動的反応が異なるのは、パーソナリティが仲介しているため\n4. 一定の場面に置かれた個人が，どういう行動をとるかを示すもの"}, {"sheet": "第1回～第3回", "row": 9, "number": "問7", "question": "「パーソナリティ」と「性格」の違いに関して、下の選択肢の中から適切な記述を4つ選びなさい（「第2回パーソナリティ：類型論」より）。\n", "options": "1. 性格は、感情や意志など、情意的側面を表す概念として用いられることが多い\n  2. パーソナリティは、環境に適応する過程で、形成され変容していくという特徴が強い\n  3. 性格は、生まれながら備わっているという生得的傾向性が強い\n  4. パーソナリティは、知能や学力など知的側面を表す概念として用いられることが多い\n  5. 性格は、行動や態度など、行動的側面を表す概念として用いられることが多い\n  6. パーソナリティは、情意的側面に加え、知能、行動、態度などを含む全人格的側面を表す概念として用いられることが多い", "answer": "1. 性格は、感情や意志など、情意的側面を表す概念として用いられることが多い\n3. 性格は、生まれながら備わっているという生得的傾向性が強い\n2. パーソナリティは、環境に適応する過程で、形成され変容していくという特徴が強い\n6. パーソナリティは、情意的側面に加え、知能、行動、態度などを含む全人格的側面を表す概念として用いられることが多い"}, {"sheet": "第1回～第3回", "row": 10, "number": "問8", "question": "パーソナリティ理論の「類型論」とは何か。下の選択肢の中から適切な記述を2つ選びなさい（「第2回パーソナリティ：類型論」より）。\n", "options": " 1. 代表的な理論として、ゴールドバーグのBig Five性格論がある\n  2. 人の性格を、心理的な要素の構成体として表現する\n  3. 全体的な性格特徴によって、人をいくつかの類型に分類する\n  4. 代表的な理論として、ユングの向性に基づく性格論や、クレッチマーの気質に基づく性格論がある\n  5. 個々人の特性（要素）を量的に測定し、それらを組み合わせてパーソナリティを記述する", "answer": "4. 代表的な理論として、ユングの向性に基づく性格論や、クレッチマーの気質に基づく性格論がある\n3. 全体的な性格特徴によって、人をいくつかの類型に分類する"}, {"sheet": "第1回～第3回", "row": 11, "number": "問9", "question": "ユングの心的エネルギーの方向性に基づく類型論に関して、以下の特徴は「内向性」「外向性」のどちらに対応するか。該当する方にチェックを付けなさい（「第2回パーソナリティ：類型論より）。", "options": null, "answer": null}, {"sheet": "第1回～第3回", "row": 12, "number": "問10", "question": "クレッチマーの気質に基づく類型論に関して、以下の記述は3つの気質「神経質」「循環質」「粘着質」のどれに対応するか。選択肢（プルダウン）の中から選びなさい（「第2回パーソナリティ：類型論より）。", "options": "A群\n  1 開放的で人情家，素朴な情緒性が特徴\n  2 几帳面で秩序好き，ときに爆発的な情緒傾向\n  3 非社交的，きまじめで冷静，情緒的交流が少ない\nB群\n  01 粘着質\n  02 神経質\n  03 循環質", "answer": "1 - 03. 循環質\n2 - 01. 粘着質\n3 - 02. 神経質"}, {"sheet": "第1回～第3回", "row": 13, "number": "問11", "question": "シュプランガーの類型論に関して、以下の記述は6つの価値「理論型」「経済型」「審美型」「社会型」「権力型」「宗教型」のどれに対応するか。選択肢（プルダウン）の中から選びなさい（「第2回パーソナリティ：類型論より）。", "options": "A群\n  1 効用的価値が中心。生存の手段としての有効性を重視\n  2 美的価値が中心。調和や優美という観点から経験を楽しむ\n  3 他者への愛が価値の中心。他者の生まで共に生きる\n  4 他者に対する権力・影響力が価値の中心。他の価値はすべてその手段\n  5 真理が価値の中心。理論的・客観的認識を求める\n  6 全宇宙を包括する全体性と一体化に価値の中心。世俗に神性を見る、または世俗を否定し超越する\nB群\n  01 宗教型\n  02 審美型\n  03 社会型\n  04 経済型\n  05 理論型\n  06 権力型", "answer": "1 - 04. 経済型\n2 - 02. 審美型\n3 - 03. 社会型\n4 - 06. 権力型\n5 - 05. 理論型\n6 - 01. 宗教型"}, {"sheet": "第1回～第3回", "row": 14, "number": "問12", "question": "「類型論」の利点や問題点に関して、下の選択肢の中から適切な記述を4つ選びなさい（「第2回パーソナリティ：類型論」より）。\n", "options": " 1. 血液型による性格分類など、様々なタイプ分けの議論を進展させた\n  2. 固定的なレッテルを貼ってしまう\n  3. 類型の特徴が強調されて，個人の独自性を表す他の特徴が見落とされる\n  4. 個人の全体像を概観するのに役立つ\n  5. 個人の特徴を量的に測定することができ、客観的な評価が可能\n  6. 混合型・中間型が無視される", "answer": "4. 個人の全体像を概観するのに役立つ\n3. 類型の特徴が強調されて，個人の独自性を表す他の特徴が見落とされる\n2. 固定的なレッテルを貼ってしまう\n6. 混合型・中間型が無視される"}, {"sheet": "第1回～第3回", "row": 15, "number": "問13", "question": "「特性（trait）」とは何か。下の選択肢の中から関連する適切な記述を2つ選びなさい（「第3回パーソナリティ：特性論」より）。\n", "options": "  1. 個性と同義\n  2. 性格を構成する個々の特徴・要素\n  3. 個性的な人がもつ特別な性格特徴\n  4. 気質と同義\n  5. 地味で暗くて、向上心も協調性も存在感も個性も華もない・・・\n  6. 個人がもつ全体的な性格特徴", "answer": "2. 性格を構成する個々の特徴・要素\n5. 地味で暗くて、向上心も協調性も存在感も個性も華もない・・・"}, {"sheet": "第1回～第3回", "row": 16, "number": "問14", "question": "「特性論（trait theory）」とは何か。下の選択肢の中から適切な記述を2つ選びなさい（「第3回パーソナリティ：特性論」より）。\n", "options": "  1. 個々の特性・要素を量的に測定し、それらを組み合わせてパーソナリティを記述すること\n  2. 人の性格を、特徴や要素の構成体として表現する考え方\n  3. 「類型論」を発展させた考え方で、性格特徴の類型をより小さな単位に細分化し、数多くの類型で、様々な人の性格を説明すること\n  4. 典型的な性格類型との「類似性」を量的に記述すること\n  5. 全体的な性格特徴によって、人をいくつかの類型に分類すること", "answer": "1. 個々の特性・要素を量的に測定し、それらを組み合わせてパーソナリティを記述すること\n2. 人の性格を、特徴や要素の構成体として表現する考え方"}, {"sheet": "第1回～第3回", "row": 17, "number": "問15", "question": "以下の記述は、「類型論」と「特性論」のどちらに対応するか。該当する方にチェックを付けなさい（「第3回パーソナリティ：特性論」より）。\n", "options": null, "answer": null}, {"sheet ": "第4回", "row": 8, "number": "問6", "question": "タイプA行動パターンがなぜ動脈疾患と関係するのか。下の選択肢の中から適切な記述を1つ選びなさい（「第4回パーソナリティ：タイプA」より）。", "options": "1.\t \t低血圧や低血糖を招き、循環器系に負担をかけるため\n2.\t \t食生活が不規則になり、胃腸の不調が循環系の働きに影響を及ぼすため\n3.\t \t免疫力の低下を招き、そのことが循環器系の働きに影響を及ぼすため\n4.\t \tホルモンのバランスを崩し、循環器系に負担をかけるため\n5.\t \t高血圧や脈拍増を招き、循環器系に負担をかけるため", "answer": 5}, {"sheet": "第4回", "row": 9, "number": "問7", "question": "タイプA行動パターンを提唱したフリードマン氏のエピソードに関して、下の選択肢の中から適切な記述を2つ選びなさい（「第4回パーソナリティ：タイプA」より）。", "options": "1.\t \t診察の待合室で待つ心臓疾患の患者を観察したところ、すぐに立ち上がれるよう腰浅く椅子に座っていた\n2.\t \t診察の待合室で待つ心臓疾患の患者を観察したところ、睡眠不足のためか多くが居眠っていた\n3.\t \t心臓発作を起こしたビジネスマンの多くが、過度の競争に没頭するという特徴があることを調査で明らかにした\n4.\t \t診察の待合室で待つ心臓疾患の患者を観察したところ、リラックスした様子で椅子に深く腰かけていた\n5.\t \t心臓発作を起こしたビジネスマンの多くが、激しいスポーツに熱中するという特徴があることを調査で明らかにした", "answer": "1.\n3."}, {"sheet": "第4回", "row": 10, "number": "問8", "question": "性格傾向と、身体的反応や疾患との関係について、下の選択肢の中から適切な記述を2つ選びなさい（「第4回パーソナリティ：タイプA」より）。\n※白衣効果とは、病院で測定する血圧の方が、家庭で測定する血圧よりも高いことをいう", "options": "1.\t \t神経質傾向のある人は、心筋梗塞の発症率が高い\n2.\t \t内向的な人ほど、白衣効果が強い\n3.\t \t抑うつ傾向のある人は、心筋梗塞の発症率が高い\n4.\t \t外向的な人ほど、白衣効果が強い\n5.\t \t協調性の高い人ほど、心筋梗塞の発症率が高い\n6.\t \t協調性の高い人ほど、白衣効果が強い", "answer": "2.\n3."}, {"sheet": "第4回", "row": 11, "number": "問9", "question": "タイプA行動パターンと社会情勢との関係について、下の選択肢の中から適切な記述を3つ選びなさい（「第4回パーソナリティ：タイプA」より）。", "options": "1.\t \t1960〜70年代の競争社会に過剰適応した人が、タイプA行動パターンを示した可能性がある\n2.\t \t1980年代以降も、タイプA行動パターンと動脈疾患との関連性が多くの調査で報告されている\n3.\t \t日本人の場合、1980年代のバブル経済期に、タイプA行動パターンと心臓疾患との関連性が強く示された\n4.\t \tストレス解消法の普及や健康意識の向上が進むと、タイプA行動パターンと動脈疾患は関連しなくなる可能性がある\n5.\t \t1980年代以降、タイプA行動パターンと動脈疾患との関連性を否定する報告が増えた", "answer": "1.\n4.\n5."}, {"sheet": "第4回", "row": 12, "number": "問10", "question": "タイプA行動パターンは変容するか。下の選択肢の中から適切な記述を2つ選びなさい（「第4回パーソナリティ：タイプA」より）。", "options": "1.\t \tカウンセリングを受けることで、行動が変容し、心筋梗塞の再発率が低下する\n2.\t \tカウンセリングを受けると、かえってタイプA行動パターンの傾向が強まる\n3.\t \tカウンセリングを受けても、タイプA行動パターンの人の行動はほとんど変わらない\n4.\t \tカウンセリングを受けることで、タイプA行動パターンは弱まる\n5.\t \tカウンセリングを受けると、タイプA行動パターンは変わらないが、タイプB行動パターンが促進される", "answer": "1.\n4."}, {"sheet": "第5回", "row": 3, "number": "問1", "question": "「交流分析（Transactional Analysis）」とは何か。下の選択肢の中から適切な記述を3つ選びなさい（「第5回交流分析」より）。", "options": "1.\t \t対人関係で起きている交流パターンを分析するというパーソナリティ理論\n2.\t \t精神科医エリックバーン氏が提唱した心理療法のためのパーソナリティ理論\n3.\t \t精神分析学者フロイト氏が提唱した心理療法のためのカウンセリング技法\n4.\t \t2つの自我状態（内向・外向）を人がどのように使い分けているかという分析が代表的\n5.\t \t対人関係の形成傾向を「直流型」と「交流型」に分けて、人のパーソナリティを説明する理論\n6.\t \t対人関係における自分の行動の特徴やコミュニケーションの癖（くせ）を見直す際に用いられる", "answer": "1.\n2.\n6."}, {"sheet": "第5回", "row": 4, "number": "問2", "question": "「交流（Transaction）」とは何か。下の選択肢の中から適切な記述を1つ選びなさい（「第5回交流分析」より）。", "options": "1.\t \t言葉のキャッチボール\n2.\t \t一方向でない、双方向のコミュニケーションスタイルを、電流方式に例えた表現\n3.\t \tお金のやりとり\n4.\t \t異なる文化や社会の人々とコミュニケーションを行い、「相互理解」を深めること\n5.\t \t非言語の心理的な刺激を含む「人とのやりとり」", "answer": 5}, {"sheet": "第5回", "row": 5, "number": "問3", "question": "「ストローク」とは何か。下の選択肢の中から適切な記述を3つ選びなさい（「第5回交流分析」より）。", "options": "1.\t \t肯定的ストロークvs否定的ストローク、条件付きストロークvs無条件ストロールなどの分類がある\n2.\t \t相手の存在や価値を認める言葉など、言語表現として人が他者に与える明確な刺激\n3.\t \t相手の存在や価値を認めるなど、人が他者に与える非言語な刺激\n4.\t \t「こころ」をなでる\n5.\t \t「こころ」の中をかき回す\n6.\t \t「こころ」をたたく", "answer": "1.\n3.\n4."}, {"sheet": "第5回", "row": 6, "number": "問4", "question": "3つの自我状態に関して、下の項目は「P(親）」「A（大人）」「C（子ども）」のどれに対応するか。選択肢（プルダウン）の中から選びなさい（「第5回交流分析」より）。", "options": "(1)\t幼い頃の行動様式や感情表現の自我\n(2)\t親の役割を取り入れた自我\n(3)\t客観的事実をもとに判断する自我", "answer": "(1)2.C(子ども)\n(2)1.P(親)\n(3)3.A(大人)"}, {"sheet": "第5回", "row": 7, "number": "問5", "question": "「エゴグラム」とは何か。下の選択肢の中から適切な記述を2つ選びなさい（「第5回交流分析」より）。", "options": "1.\t \t3つ（5つ）の自我状態を測り、グラフ化する性格診断テスト\n2.\t \tプロフィールの形から、N型（優しいが主体性がない）などのタイプ分けの診断も行われる\n3.\t \t自我の強さを、重量に例えて測定する性格診断テスト\n4.\t \t精神科医エゴグラム氏が開発した、3つ（5つ）の自我状態を測る性格診断テスト\n5.\t \t3つ（5つ）の自我状態の測定値を合計することで、全体的な自我の強さが可視化される", "answer": "1.\n2."}, {"sheet": "第5回", "row": 8, "number": "問6", "question": "以下の自我状態の負の側面は、「CP（批判的親）」「NP（養育的親）」「A（大人）」「FC（自由な子ども）」「AC（順応した子ども）」のどれに対応するか。選択肢（プルダウン）の中から選びなさい（「第5回交流分析」より）。", "options": "(1)\t自己中心的\n(2)\t親切の押し売り\n(3)\t自発性不足\n(4)\t冷たい人間像\n(5)\t価値観の押しつけ", "answer": "(1)1.FC（自由な子ども）\n(2)親5.NP（養育的親）\n(3)4.AC（順応した子ども）\n(4)2.A（大人）\n(5)3.CP（批判的親）"}, {"sheet": "第5回", "row": 9, "number": "問7", "question": "以下のキーワードは、「CP（批判的親）」「NP（養育的親）」「A（大人）」「FC（自由な子ども）」「AC（順応した子ども）」のどれに対応するか。表内の該当するところにチェックを付けなさい（「第5回交流分析」より）。（次頁につづく）", "options": null, "answer": null}, {"sheet": "第5回", "row": 10, "number": "問8", "question": "（前頁からのつづき）以下のキーワードは、「CP（批判的親）」「NP（養育的親）」「A（大人）」「FC（自由な子ども）」「AC（順応した子ども）」のどれに対応するか。表内の該当するところにチェックを付けなさい（「第5回交流分析」より）。", "options": null, "answer": null}, {"sheet": "第5回", "row": 11, "number": "問9", "question": "\n以下の記述は、「批判するわたし」「優しいわたし」「理性的なわたし」「自由な子どものわたし」「いい子のわたし」のどれに対応するか。表内の該当するところにチェックを付けなさい（「第5回交流分析」より）。（次頁につづく）", "options": null, "answer": null}, {"sheet": "第5回", "row": 12, "number": "問10", "question": "（前頁からのつづき）以下の記述は、「批判するわたし」「優しいわたし」「理性的なわたし」「自由な子どものわたし」「いい子のわたし」のどれに対応するか。表内の該当するところにチェックを付けなさい（「第5回交流分析」より）。", "options": null, "answer": null}];

function resetCurrent(){picked=new Set();mapping={};checked=false;shown=false}
function stats(){let all=DATA.filter(q=>group==='all'||q.sheet===group);let answered=all.filter(q=>storage[key(q)]?.attempts>0);let good=all.filter(q=>storage[key(q)]?.last===true);$('count').textContent=queue.length?`${idx+1} / ${queue.length} 問`:'対象の問題がありません';$('score').textContent=`解答済み ${answered.length}/${all.length}　直近の正解 ${good.length}`;$('fill').style.width=(queue.length?(idx+1)/queue.length*100:0)+'%'}
function tabs(){const groups=['all',...new Set(DATA.map(q=>q.sheet))];$('tabs').innerHTML=groups.map(g=>`<button class="tab ${group===g?'active':''}" data-group="${esc(g)}">${g==='all'?'全範囲':esc(g)}</button>`).join('');document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{group=b.dataset.group;wrongOnly=false;order();tabs()}))}
function render(){stats();if(!queue.length){$('content').innerHTML='<div class="card"><h2>該当する問題はありません</h2><p class="muted">「すべての問題」で戻れます。</p></div>';return}let q=queue[idx],type=getType(q);let html=`<section class="card"><div class="badge">${esc(q.sheet)} ・ ${esc(q.number)} / 全${DATA.length}問</div><h2>${esc(q.question)}</h2>`;
if(type==='image'){const d=IMAGE_DATA[key(q)];html+=`<div class="image-note">元Excelの選択肢（原画像）です。表の上から順に各行の回答を選択してください。</div><div class="source-image-holder"><img class="source-image" src="${d.optionImage}" alt="元Excelの選択肢表"></div><div class="image-options">${d.correct.map((v,i)=>`<div class="image-row"><label for="ir${i}">上から${i+1}行目</label><select id="ir${i}" data-match="${i}"><option value="">選択してください</option>${d.labels.map((label,j)=>`<option value="${j+1}" ${mapping[i]===String(j+1)?'selected':''}>${j+1}. ${esc(label)}</option>`).join('')}</select></div>`).join('')}</div>`}
else if(type==='unavailable'){html+=`<div class="warning">元のExcelで、この問題の選択肢または正解が未記載です。問題文はそのまま収録していますが、採点は行いません。</div>${q.options?`<pre class="answer">${esc(q.options)}</pre>`:''}`}
else if(type==='standard'){const opts=parseOptions(q.options);html+='<div class="choices">'+opts.map(o=>`<button class="choice ${picked.has(o.n)?'selected':''}" data-opt="${o.n}" aria-pressed="${picked.has(o.n)}"><span class="marker">${esc(o.n)}.</span><span>${esc(o.label)}</span></button>`).join('')+'</div>';if(!opts.length)html+=`<div class="warning">選択肢を自動認識できませんでした。原文：<pre>${esc(q.options)}</pre></div>`}
else{const x=type==='group'?parseGroup(q):parseParent(q);html+='<div class="matchbox">'+x.rows.map(r=>`<div class="matchrow"><label for="s${esc(r.n)}"><b>${type==='group'?esc(r.n):'('+esc(r.n)+')'}.</b> ${esc(r.text)}</label><select id="s${esc(r.n)}" data-match="${esc(r.n)}"><option value="">選択してください</option>${x.choices.map(c=>`<option value="${esc(c.n)}" ${mapping[r.n]===c.n?'selected':''}>${esc(c.n)}. ${esc(c.text)}</option>`).join('')}</select></div>`).join('')+'</div>'}
html+=`<div class="actions"><button class="btn" id="prev" ${idx===0?'disabled':''}>← 前の問題</button><button class="btn primary" id="check" ${type==='unavailable'?'disabled':''}>答え合わせ</button><button class="btn" id="reveal">正解を表示</button><button class="btn" id="next" ${idx===queue.length-1?'disabled':''}>次の問題 →</button></div><div id="result"></div></section>`;$('content').innerHTML=html;
document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{if(checked)return;const n=b.dataset.opt;picked.has(n)?picked.delete(n):picked.add(n);b.classList.toggle('selected',picked.has(n));b.setAttribute('aria-pressed',picked.has(n))}));document.querySelectorAll('[data-match]').forEach(s=>s.addEventListener('change',()=>{if(checked)return;mapping[s.dataset.match]=s.value}));$('prev').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);$('reveal').onclick=()=>{shown=!shown;showResult(null)};$('check').onclick=()=>check();if(checked)showResult(storage[key(q)]?.last)}
function navigate(n){idx+=n;resetCurrent();render();window.scrollTo({top:0,behavior:'smooth'})}
function check(){const q=queue[idx],type=getType(q);if(type==='unavailable')return;let ok=false;if(type==='image'){const d=IMAGE_DATA[key(q)];if(d.correct.some((_,i)=>!mapping[i])){alert('すべての行に回答してください');return}ok=d.correct.every((n,i)=>mapping[i]===String(n))}else if(type==='standard'){let actual=[...picked].sort().join(',');let expected=correctNums(q).sort().join(',');if(!actual){alert('回答を選んでください');return}ok=actual===expected}else{let x=type==='group'?parseGroup(q):parseParent(q);if(x.rows.some(r=>!mapping[r.n])){alert('すべての項目を選択してください');return}ok=x.rows.every(r=>mapping[r.n]===x.answer[r.n])}checked=true;shown=true;const k=key(q);storage[k]={attempts:(storage[k]?.attempts||0)+1,last:ok};persist();document.querySelectorAll('[data-opt], [data-match]').forEach(el=>el.disabled=true);showResult(ok);stats()}
function showResult(ok){let q=queue[idx];let className=ok===true?'good':ok===false?'bad':'';let title=ok===true?'✅ 正解！':ok===false?'❌ 不正解':'正解の確認';let detail=shown?(IMAGE_DATA[key(q)]?`<div class="answer"><b>元Excelの正解画像（原画像）</b><div class="source-image-holder"><img class="source-image" src="${IMAGE_DATA[key(q)].answerImage}" alt="元Excelの正解表"></div></div>`:`<div class="answer"><b>元ファイルの「正解」欄（原文）</b><pre>${q.answer!=null?esc(q.answer):'正解データなし'}</pre></div>`):'';$('result').innerHTML=shown||ok!==null?`<div class="feedback ${className}"><strong>${title}</strong>${detail}</div>`:'';$('reveal').textContent=shown?'正解を隠す':'正解を表示'}
$('shuffle').onclick=()=>{for(let j=queue.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[queue[j],queue[k]]=[queue[k],queue[j]]}idx=0;resetCurrent();render()};$('wrong').onclick=()=>{wrongOnly=true;order()};$('all').onclick=()=>{wrongOnly=false;order()};$('reset').onclick=()=>{if(confirm('このブラウザーの学習履歴をすべて削除しますか？')){storage={};persist();wrongOnly=false;order()}};
tabs();order();
</script></body></html>
